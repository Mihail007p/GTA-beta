name: Temporary public Open Street check
on:
  push:
    paths:
      - '.github/workflows/temporary-public-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the exact published source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 397be73cf72f060499e10c1a81abcc3ae098ee4e
          persist-credentials: false
      - name: Verify public APK and browser resources without credentials
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error title=Public download check::Command failed at script line $LINENO."' ERR
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            'https://github.com/Mihail007p/GTA-beta/releases/download/v0.16.0-android.1/OpenStreet-v0.16.0.apk' \
            --output "$RUNNER_TEMP/OpenStreet-v0.16.0.apk"
          echo '330822839eb07b2f4c5a049fa2bc5a40f542993784025d2c17bc29670cb3c9e1  '"$RUNNER_TEMP/OpenStreet-v0.16.0.apk" | sha256sum -c -
          unzip -tq "$RUNNER_TEMP/OpenStreet-v0.16.0.apk" >/dev/null
          echo '::notice title=Public APK::Unauthenticated download, checksum and ZIP integrity verified.'
          base='https://rawcdn.githack.com/Mihail007p/GTA-beta/397be73cf72f060499e10c1a81abcc3ae098ee4e/game'
          for file in sw.js js/main.js js/life.js js/crowd-collisions.js js/work-crowd.js assets/characters/citizen-1.glb assets/characters/citizen-2.glb; do
            mkdir -p "$RUNNER_TEMP/public-game/$(dirname "$file")"
            curl --fail --location --retry 3 --retry-all-errors --silent --show-error "$base/$file" --output "$RUNNER_TEMP/public-game/$file"
            cmp "$GITHUB_WORKSPACE/game/$file" "$RUNNER_TEMP/public-game/$file"
          done
          echo '::notice title=Public browser resources::Worker, job and collision modules and citizens match the merged commit.'
      - name: Play public browser game online and offline
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/public-game-test" --no-audit --no-fund playwright-core@1.64.1
          cat > "$RUNNER_TEMP/public-game-test/check.cjs" <<'NODE'
          const { chromium } = require('playwright-core');
          const assert = require('node:assert/strict');
          (async () => {
            const browser = await chromium.launch({ executablePath: '/usr/bin/google-chrome', headless: true,
              args: ['--no-sandbox', '--use-angle=swiftshader', '--enable-unsafe-swiftshader', '--ignore-gpu-blocklist'] });
            const context = await browser.newContext({ viewport: { width: 820, height: 370 }, isMobile: true, hasTouch: true });
            const page = await context.newPage(), errors = [];
            let stage = 'initializing';
            const mark = label => { stage = label; console.log(`::notice title=Public test stage::${label}`); };
            page.on('pageerror', e => errors.push(e.message));
            page.on('console', m => { if (m.type() === 'error') errors.push(m.text()); });
            const wait = (f, arg = null) => page.waitForFunction(f, arg, { timeout: 120000 });
            const tap = sel => page.locator(sel).tap();
            const label = text => wait(t => document.querySelector('#vehicle-action').getAttribute('aria-label') === t &&
              !document.querySelector('#vehicle-action').classList.contains('hidden'), text);
            const start = async () => {
              await wait(() => !!window.__game);
              if (await page.evaluate(() => __game.state === 'loading')) await tap('#loading');
              await wait(() => __game.state === 'menu');
              await tap('#btn-play');
              await wait(() => __game.state === 'play' && __game.onFoot && __game.R.crowdActors.length === 4);
            };
            try {
              const url = 'https://rawcdn.githack.com/Mihail007p/GTA-beta/397be73cf72f060499e10c1a81abcc3ae098ee4e/game/index.html';
              mark('opening public link');
              const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
              assert.equal(response.status(), 200);
              const notice = page.getByRole('button', { name: 'Open the page' });
              if (await notice.count()) await notice.click();
              await start();
              mark('accepting a taxi job through the public UI');
              await page.evaluate(() => {
                const d = __game.entrances.find(x => x.kind === 'shop');
                Object.assign(__game.hero, { x: d.x, z: d.z, vx: 0, vz: 0, speed: 0 });
              });
              await label('Войти в магазин'); await tap('#vehicle-action');
              await wait(() => __game.interior?.layout.kind === 'shop' && !__game.roomTransition);
              await page.evaluate(() => {
                const i = __game.interior.layout.interactions[0];
                Object.assign(__game.hero, { x: i.x, z: i.z, vx: 0, vz: 0, speed: 0 });
              });
              await label('Поговорить с продавцом'); await tap('#vehicle-action');
              await page.locator('[data-action="job"][data-id="taxi"]').scrollIntoViewIfNeeded();
              await tap('[data-action="job"][data-id="taxi"]');
              assert.equal(await page.evaluate(() => __game.save.life.job?.stage), 'pickup');
              mark('checking offline cache');
              await wait(() => !!navigator.serviceWorker.controller);
              const cached = await page.evaluate(async () => {
                const reg = await navigator.serviceWorker.ready;
                const cache = await caches.open(`openstreet:${reg.scope}:v16`);
                const names = ['index.html', 'js/crowd-collisions.js', 'js/work-crowd.js', 'assets/characters/citizen-1.glb'];
                return { files: await Promise.all(names.map(async name => !!(await cache.match(name)))),
                  isGameHtml: (await (await cache.match('index.html')).text()).includes('id="scene"') };
              });
              assert.deepEqual(cached.files, [true, true, true, true]); assert.equal(cached.isGameHtml, true);
              await context.setOffline(true);
              await page.reload({ waitUntil: 'domcontentloaded', timeout: 60000 }); await start();
              assert.equal(await page.evaluate(() => __game.save.life.job?.stage), 'pickup');
              mark('boarding and completing the saved taxi job offline');
              // Distant positions are set only to shorten the route; the real UI and game logic perform the actions.
              await page.evaluate(() => {
                const g = __game, s = g.city.start;
                Object.assign(g.car, { x: s.x, z: s.z, heading: Math.PI / 2, vx: 0, vz: 0, speed: 0, lateral: 0, yawRate: 0 });
                Object.assign(g.hero, { x: s.x + 2, z: s.z, vx: 0, vz: 0, speed: 0 });
              });
              await label('Сесть в машину'); await tap('#vehicle-action'); await wait(() => !__game.onFoot);
              const positionCar = () => page.evaluate(() => {
                const g = __game, d = g.entrances.find(x => x.id === g.save.life.job.targetId);
                Object.assign(g.car, { x: d.x + d.nx * 4.5, z: d.z + d.nz * 4.5, heading: Math.atan2(-d.nz, -d.nx),
                  vx: 0, vz: 0, speed: 0, lateral: 0, yawRate: 0 });
              });
              await positionCar(); await label('Посадить пассажира'); await tap('#vehicle-action');
              await wait(() => __game.save.life.job?.stage === 'drive' && __game.crowd.people.some(p => p.condition === 'taxi-seat'));
              await positionCar(); await label('Высадить пассажира');
              const before = await page.evaluate(() => __game.save.money);
              await tap('#vehicle-action'); await wait(() => !__game.save.life.job);
              assert.equal(await page.evaluate(() => __game.save.money), Math.round((before + 380) * 100) / 100);
              assert.equal(await page.evaluate(() => __game.save.life.completedJobs), 1);
              mark('checking browser errors');
              assert.deepEqual(errors, []);
              console.log('::notice title=Public game::Online UI, saved taxi job, cached files and offline completion verified in mobile Chromium.');
            } catch (e) {
              const message = `${stage}: ${e.message}; browser errors: ${errors.join(' | ')}`.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
              console.error(`::error title=Public game check::${message}`); throw e;
            } finally { await context.close(); await browser.close(); }
          })().catch(e => { console.error(e.stack || e); process.exit(1); });
          NODE
          node "$RUNNER_TEMP/public-game-test/check.cjs"
