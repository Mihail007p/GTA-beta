name: Temporary public download check
on:
  push:
    paths:
      - '.github/workflows/temporary-public-apk-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download public APK without credentials and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error title=Public download check::Command failed at script line $LINENO."' ERR
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            'https://github.com/Mihail007p/GTA-beta/releases/download/v0.15.0-android.1/OpenStreet-v0.15.0.apk' \
            --output "$RUNNER_TEMP/OpenStreet-v0.15.0.apk"
          echo '575a5d4b6fb97b116dcb12c800af1a70141a2adb8f894adb65190b7def5615e2  '"$RUNNER_TEMP/OpenStreet-v0.15.0.apk" | sha256sum -c -
          unzip -tq "$RUNNER_TEMP/OpenStreet-v0.15.0.apk" >/dev/null
          echo '::notice title=Public APK::Unauthenticated download, checksum and ZIP integrity verified.'
      - name: Verify public browser game resources
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error title=Public browser check::Command failed at script line $LINENO."' ERR
          base='https://rawcdn.githack.com/Mihail007p/GTA-beta/b443e933ab06f8715cffe114c31edccbc8f7b938/game'
          mkdir -p "$RUNNER_TEMP/public-game/js" "$RUNNER_TEMP/public-game/assets/characters"
          cd "$RUNNER_TEMP/public-game"
          for file in sw.js js/life.js assets/characters/hero-1-smart.glb assets/characters/hero-2-smart.glb assets/characters/citizen-1.glb assets/characters/citizen-2.glb; do
            curl --fail --location --retry 3 --retry-all-errors --silent --show-error "$base/$file" --output "$file"
          done
          sha256sum -c <<'CHECKSUMS'
          da73912e40c4d6f6572f0eb0337f9d40405e0168c384cfd375f932fbe58ecd52  sw.js
          fd42494fc7ceb6e8919d7dae2639a2d2c77fa95e4154629a5f592da262d95d5f  js/life.js
          531bd5afae05fdbd5680279b1566242e78fa2d1fb97c4e34f55b2be0f89c1c6b  assets/characters/hero-1-smart.glb
          c1aef7ef588fcd7abfcad324f4546f8a8f95453d8fad1710efbc9bee129a6ec3  assets/characters/hero-2-smart.glb
          d7f812bc7a0a9a69ca61ac3680258d33604c4574f9117ba97a0c42f1166b5773  assets/characters/citizen-1.glb
          316b3407807cff9d79767b16f86feec6e908ed3d25c9b94078fc74af4f295b6a  assets/characters/citizen-2.glb
          CHECKSUMS
          echo '::notice title=Public browser resources::Service worker, life logic and new character models match the merged commit.'
