name: Temporary Android release upload
on:
  push:
    paths:
      - '.github/workflows/temporary-publish-android.yml'
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download verified build from merged main commit
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: openstreet-android-0.14.0
          path: ${{ runner.temp }}/openstreet-release
          run-id: 40888676478
          github-token: ${{ github.token }}
      - name: Verify the draft and upload the APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'echo "::error title=Release upload check::Command failed at script line $LINENO."' ERR
          repo="$GITHUB_REPOSITORY"
          tag='v0.14.0-android.1'
          expected_commit='b98add11ef9388c3017690450896f716ed380ce5'
          actual_commit="$(gh api "repos/$repo/actions/runs/40888676478" --jq .head_sha)"
          conclusion="$(gh api "repos/$repo/actions/runs/40888676478" --jq .conclusion)"
          test "$actual_commit" = "$expected_commit"
          test "$conclusion" = success
          echo '::notice title=Release upload check::Verified source build commit and result.'
          release="$(gh release view "$tag" --repo "$repo" --json isDraft,targetCommitish,tagName)"
          test "$(jq -r .isDraft <<<"$release")" = true
          test "$(jq -r .targetCommitish <<<"$release")" = "$expected_commit"
          test "$(jq -r .tagName <<<"$release")" = "$tag"
          echo '::notice title=Release upload check::Draft release target verified.'
          cd "$RUNNER_TEMP/openstreet-release"
          test -f OpenStreet-v0.14.0.apk
          test -f SHA256SUMS.txt
          test -f signature.txt
          echo "::notice title=Release artifact contents::$(find . -maxdepth 2 -type f -printf '%p;' | sort)"
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          sha256sum -c SHA256SUMS.txt
          echo '::notice title=Release upload check::Artifact checksum verified.'
          grep -Fq 'Verified using v1 scheme (JAR signing): true' signature.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' signature.txt
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' signature.txt
          grep -Fq 'Number of signers: 1' signature.txt
          sha="$(sha256sum OpenStreet-v0.14.0.apk | cut -d ' ' -f 1)"
          cert="$(awk -F ': ' '/certificate SHA-256 digest:/ {print $NF}' signature.txt | tr '[:upper:]' '[:lower:]' | sort -u)"
          echo "::notice title=Public certificate line::$(grep -F 'certificate SHA-256 digest:' signature.txt | tr '\n' ';')"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$cert" =~ ^[0-9a-f]{64}$ ]]
          test "$cert" = 'e8809821836880e73d0e01727509e53845b0ebab37cb72f6e5ee64cc4711d8d4'
          echo "::notice title=APK SHA-256::$sha"
          echo "::notice title=Signing certificate SHA-256::$cert"
          gh release upload "$tag" --repo "$repo" OpenStreet-v0.14.0.apk
