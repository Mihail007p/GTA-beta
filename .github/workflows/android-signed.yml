name: Android signed APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/version.properties'
      - '.github/workflows/android-signed.yml'

permissions:
  contents: read

concurrency:
  group: android-signed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Read Android version
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          props = {}
          for line in pathlib.Path('android/version.properties').read_text().splitlines():
              if '=' in line and not line.lstrip().startswith('#'):
                  key, value = line.split('=', 1)
                  props[key.strip()] = value.strip()
          if not re.fullmatch(r'\d+\.\d+\.\d+', props.get('VERSION_NAME', '')):
              raise SystemExit('Invalid VERSION_NAME')
          if not re.fullmatch(r'[1-9]\d*', props.get('VERSION_CODE', '')):
              raise SystemExit('Invalid VERSION_CODE')
          if props.get('APP_ID') != 'ru.openstreet.game':
              raise SystemExit('Unexpected Android package ID')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print(f"name={props['VERSION_NAME']}", file=out)
              print(f"code={props['VERSION_CODE']}", file=out)
          PY
      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          node --test game/tests/*.test.mjs
          node --test android/tools/signing-helper/keygen.test.cjs
          mkdir -p "$RUNNER_TEMP/openstreet-tests"
          javac -d "$RUNNER_TEMP/openstreet-tests" \
            android/app/src/main/java/ru/openstreet/game/AssetPolicy.java \
            android/app/src/test/java/ru/openstreet/game/AssetPolicyTest.java
          java -cp "$RUNNER_TEMP/openstreet-tests" ru.openstreet.game.AssetPolicyTest
      - name: Build and sign APK
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.OPENSTREET_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.OPENSTREET_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          private_dir="$(mktemp -d "${RUNNER_TEMP}/openstreet-sign.XXXXXX")"
          trap 'rm -rf -- "$private_dir"' EXIT
          python3 - "$private_dir" <<'PY'
          import base64, binascii, os, pathlib, sys
          dest = pathlib.Path(sys.argv[1])
          encoded = os.environ.get('SIGNING_KEY_BASE64', '')
          password = os.environ.get('SIGNING_PASSWORD', '')
          if not encoded or not password:
              raise SystemExit('Both Android signing secrets are required; refusing to build unsigned.')
          if '\n' in password or '\r' in password or len(password) > 4096:
              raise SystemExit('Signing password must be one line.')
          try:
              key = base64.b64decode(encoded, validate=True)
          except (ValueError, binascii.Error):
              raise SystemExit('Signing keystore must be valid base64.')
          if not 100 <= len(key) <= 30000:
              raise SystemExit('Unexpected signing keystore size.')
          (dest / 'release.p12').write_bytes(key)
          (dest / 'password.txt').write_text(password, encoding='utf-8')
          PY
          unset SIGNING_KEY_BASE64 SIGNING_PASSWORD
          export OPENSTREET_KEYSTORE="$private_dir/release.p12"
          export OPENSTREET_STOREPASS_FILE="$private_dir/password.txt"
          export OPENSTREET_KEY_ALIAS='openstreet-release'
          cd android
          ./gradlew --no-daemon :app:assembleRelease
      - name: Verify APK, version, assets and signature
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          trap 'echo "::error title=APK verification failed::Verification command failed at script line $LINENO."' ERR
          apk="$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk"
          build_tools="$(find "$sdk/build-tools" -mindepth 2 -maxdepth 2 -name apksigner -type f -printf '%h\n' | sort -V | tail -1)"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/aapt"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/openstreet-signature.txt"
          signature_summary="$(grep 'Verified using v[123] scheme' "$RUNNER_TEMP/openstreet-signature.txt" | tr '\n' ';')"
          echo "::notice title=APK signature schemes::$signature_summary"
          grep -Fq 'Verified using v1 scheme (JAR signing): true' "$RUNNER_TEMP/openstreet-signature.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/openstreet-signature.txt"
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' "$RUNNER_TEMP/openstreet-signature.txt"
          "$build_tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/openstreet-badging.txt"
          echo "::notice title=APK package::$(head -1 "$RUNNER_TEMP/openstreet-badging.txt")"
          grep -Fq "package: name='ru.openstreet.game' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" "$RUNNER_TEMP/openstreet-badging.txt"
          if ! python3 android/tools/align-apk.py --check "$apk" > "$RUNNER_TEMP/openstreet-align.log" 2>&1; then
            echo "::error title=APK alignment::$(tail -1 "$RUNNER_TEMP/openstreet-align.log")"
            exit 1
          fi
          if ! python3 android/tools/verify-apk-assets.py "$apk" > "$RUNNER_TEMP/openstreet-assets.log" 2>&1; then
            echo "::error title=APK assets::$(tail -1 "$RUNNER_TEMP/openstreet-assets.log")"
            exit 1
          fi
          cat "$RUNNER_TEMP/openstreet-align.log" "$RUNNER_TEMP/openstreet-assets.log"
          mkdir -p "$RUNNER_TEMP/openstreet-release"
          cp "$apk" "$RUNNER_TEMP/openstreet-release/OpenStreet-v$VERSION_NAME.apk"
          cp "$RUNNER_TEMP/openstreet-signature.txt" "$RUNNER_TEMP/openstreet-release/signature.txt"
          (cd "$RUNNER_TEMP/openstreet-release" && sha256sum "OpenStreet-v$VERSION_NAME.apk" > SHA256SUMS.txt)
      - name: Test packaged game in Chromium
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          cd game/tests/e2e
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install chromium
          APK_PATH="$RUNNER_TEMP/openstreet-release/OpenStreet-v$VERSION_NAME.apk" npm run android-assets
      - name: Upload verified APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openstreet-android-${{ steps.version.outputs.name }}
          path: ${{ runner.temp }}/openstreet-release/
          if-no-files-found: error
          retention-days: 14
