name: Temporary public test failure diagnostics
on:
  push:
    paths:
      - '.github/workflows/temporary-public-failure-diagnostics.yml'
permissions:
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the failed public browser test log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/123542476357/logs" \
            -o "$RUNNER_TEMP/failed-test.log"
          python3 - "$RUNNER_TEMP/failed-test.log" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          text = re.sub(r'\x1b\[[0-9;]*m', '', text)
          lines = text.splitlines()
          errors = [i for i, line in enumerate(lines) if re.search(r'(Error:|AssertionError|TimeoutError|Process completed with exit code)', line)]
          excerpt = '\n'.join(lines[max(0, errors[-1]-30):errors[-1]+1] if errors else lines[-30:])[-6000:]
          escaped = excerpt.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::notice title=First public browser test failure::' + escaped)
          PY
