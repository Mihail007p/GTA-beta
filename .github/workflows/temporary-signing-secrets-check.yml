name: Temporary Android signing secret check
on:
  push:
    paths:
      - '.github/workflows/temporary-signing-secrets-check.yml'
  workflow_dispatch:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check key and password without revealing them
        shell: bash
        env:
          ANDROID_KEY_B64: ${{ secrets.OPENSTREET_KEYSTORE_BASE64 }}
          ANDROID_PASSWORD: ${{ secrets.OPENSTREET_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          work_dir="$(mktemp -d "${RUNNER_TEMP}/openstreet-check.XXXXXX")"
          trap 'rm -rf -- "$work_dir"' EXIT
          python3 - "$work_dir" <<'PY'
          import base64, binascii, os, pathlib, sys, zipfile
          work_dir = pathlib.Path(sys.argv[1])
          encoded = os.environ.get('ANDROID_KEY_B64', '')
          password = os.environ.get('ANDROID_PASSWORD', '')
          if not encoded or not password:
              print('::error title=Missing secret::Set both OPENSTREET_KEYSTORE_BASE64 and OPENSTREET_KEYSTORE_PASSWORD in repository Actions secrets.')
              sys.exit(1)
          if '\n' in password or '\r' in password or len(password) > 4096:
              print('::error title=Invalid password::The password must be a single line from the helper.')
              sys.exit(1)
          try:
              raw = base64.b64decode(encoded, validate=True)
          except (ValueError, binascii.Error):
              print('::error title=Invalid keystore::The keystore secret must be the base64 value copied from the helper.')
              sys.exit(1)
          if not 100 <= len(raw) <= 30000:
              print('::error title=Invalid keystore::The decoded keystore has an unexpected size.')
              sys.exit(1)
          (work_dir / 'key.p12').write_bytes(raw)
          (work_dir / 'password.txt').write_text(password, encoding='utf-8')
          with zipfile.ZipFile(work_dir / 'unsigned-test.jar', 'w') as z:
              z.writestr('TEST.txt', 'Disposable test file, not an Android application.')
          PY
          unset ANDROID_KEY_B64 ANDROID_PASSWORD
          if ! keytool -J-Duser.language=en -J-Duser.country=US -list -v \
              -storetype PKCS12 -keystore "$work_dir/key.p12" -storepass:file "$work_dir/password.txt" \
              -alias openstreet-release >"$work_dir/keytool.log" 2>&1; then
            echo '::error title=Keystore check failed::The keystore, alias, or password does not match.'
            exit 1
          fi
          if ! grep -q 'Entry type: PrivateKeyEntry' "$work_dir/keytool.log"; then
            echo '::error title=Keystore check failed::The signing alias does not contain a private key.'
            exit 1
          fi
          if ! jarsigner -keystore "$work_dir/key.p12" -storetype PKCS12 \
              -storepass:file "$work_dir/password.txt" -keypass:file "$work_dir/password.txt" \
              -signedjar "$work_dir/signed-test.jar" "$work_dir/unsigned-test.jar" \
              openstreet-release >"$work_dir/sign.log" 2>&1; then
            echo '::error title=Signing check failed::Could not sign a disposable test file using that key and password.'
            exit 1
          fi
          if ! jarsigner -verify "$work_dir/signed-test.jar" >"$work_dir/verify.log" 2>&1; then
            echo '::error title=Signature check failed::The disposable test signature did not verify.'
            exit 1
          fi
          echo '::notice title=Signing check passed::Both secrets were present and the test signature verified.'
