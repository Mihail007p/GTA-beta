# One-time transfer of the already signed public APK to its GitHub release.
# No signing key or password is present in this workflow or repository.
name: Transfer Android release APK
on:
  push:
    branches: [arena/fa2baa49-gta-beta]
    paths: [release-transfer/OpenStreet-v0.13.0.apk, .github/workflows/temporary-android-release.yml]
permissions:
  contents: write
jobs:
  upload:
    if: contains(github.event.head_commit.message, '[openstreet-upload-once]')
    runs-on: ubuntu-latest
    steps:
      - name: Verify and attach the signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/OpenStreet-v0.13.0.apk"
          err="$RUNNER_TEMP/upload-error.txt"
          if ! gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/release-transfer/OpenStreet-v0.13.0.apk?ref=$GITHUB_SHA" > "$apk" 2> "$err"; then
            echo "::error title=Download failed::$(tr '\n' ' ' < "$err" | tail -c 700)"; exit 1
          fi
          if ! echo "49b21d46ee4cafc899367701c92316336c5b0f8073b289539859850078322357  $apk" | sha256sum -c -; then
            echo '::error title=Checksum mismatch::Downloaded APK differs from the verified artifact'; exit 1
          fi
          if ! gh release upload v0.13.0-android.1 "$apk" --repo "$GITHUB_REPOSITORY" 2> "$err"; then
            echo "::error title=Upload failed::$(tr '\n' ' ' < "$err" | tail -c 700)"; exit 1
          fi
